AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Console-deployable CloudFormation template for the event-driven order processing
  application. Upload the shared Lambda ZIP to S3 and provide its exact bucket and key.

Parameters:
  ResourcePrefix:
    Type: String
    Default: edop-local
    MinLength: 2
    MaxLength: 15
    AllowedPattern: '^[a-z][a-z0-9-]{1,14}$'
    Description: Lowercase prefix used to name this stack's resources; choose a unique value.
  WorkerLeaseSeconds:
    Type: String
    Default: '20'
    AllowedPattern: '^(1[1-9]|[2-5][0-9]|60)$'
    Description: Worker lease duration; must exceed the 10-second worker timeout and not exceed queue visibility.
  ArtifactBucket:
    Type: String
    MinLength: 3
    MaxLength: 63
    Description: S3 bucket containing the manually uploaded Lambda ZIP. Enter the exact bucket name.
  ArtifactKey:
    Type: String
    MinLength: 1
    Description: Exact S3 object key for the Lambda ZIP, including any prefix and filename.

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ResourcePrefix}-orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  OrdersDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}-orders-dlq'
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      RedriveAllowPolicy:
        redrivePermission: byQueue
        sourceQueueArns:
          - !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${ResourcePrefix}-orders'

  OrdersQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ResourcePrefix}-orders'
      VisibilityTimeout: 60
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrdersDlq.Arn
        maxReceiveCount: 5

  IntakeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ResourcePrefix}-intake'
      RetentionInDays: 7

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ResourcePrefix}-worker'
      RetentionInDays: 7

  IntakeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IntakeDataAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OrderTableReadCreateAndUpdate
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt OrdersTable.Arn
              - Sid: PublishOrderMessage
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt OrdersQueue.Arn
              - Sid: IntakeLogStreams
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-intake:log-stream:*'

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerQueueDataAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ConsumeOnlyOrdersQueue
                Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource: !GetAtt OrdersQueue.Arn
              - Sid: UpdateOnlyOrdersTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt OrdersTable.Arn
              - Sid: WorkerLogStreams
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-worker:log-stream:*'

  IntakeFunction:
    Type: AWS::Lambda::Function
    DependsOn: IntakeLogGroup
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-intake'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Handler: lambda_function.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt IntakeRole.Arn
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          ORDERS_QUEUE_URL: !Ref OrdersQueue

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: !Sub '${ResourcePrefix}-worker'
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Handler: worker.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Role: !GetAtt WorkerRole.Arn
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          WORKER_LEASE_SECONDS: !Ref WorkerLeaseSeconds

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ResourcePrefix}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type
          - authorization
          - x-amz-date
          - x-amz-security-token
          - x-amz-content-sha256

  IntakeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationMethod: POST
      IntegrationUri: !GetAtt IntakeFunction.Arn
      PayloadFormatVersion: '2.0'

  OrdersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /orders'
      AuthorizationType: AWS_IAM
      Target: !Join
        - /
        - - integrations
          - !Ref IntakeIntegration

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: OrdersRoute
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: 1
        ThrottlingBurstLimit: 2

  IntakeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt IntakeFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/$default/POST/orders'

  OrdersEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersQueue.Arn
      FunctionName: !GetAtt WorkerFunction.Arn
      BatchSize: 1
      Enabled: true

Outputs:
  OrdersApiUrl:
    Description: IAM-authenticated API Gateway HTTP API POST /orders endpoint.
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/orders'
  OrdersTableName:
    Value: !Ref OrdersTable
  OrdersQueueUrl:
    Value: !Ref OrdersQueue
  OrdersDlqUrl:
    Value: !Ref OrdersDlq
  IntakeFunctionArn:
    Value: !GetAtt IntakeFunction.Arn
  WorkerFunctionArn:
    Value: !GetAtt WorkerFunction.Arn
